last_audit: 2026-08-10 (documentation inventory consistency retry)
conventions:
  doc_root: .
  style: technical, concise, evidence-backed; README uses command examples and tables
  auto_gen:
    - none
  version_files:
    - CHANGELOG.md
  semver_policy:
    feat: minor
    fix: patch
    docs_chore_test: no bump
mapping:
  - artifact: DOCS.md
    path: .agentera/docs.yaml
    producers: [dokumentera]
  - artifact: VISION.md
    path: .agentera/vision.yaml
    producers: [visionera]
  - artifact: PROGRESS.md
    path: .agentera/progress.yaml
    producers: [realisera, orkestrera]
  - artifact: DECISIONS.md
    path: .agentera/decisions.yaml
    producers: [resonera, planera]
  - artifact: HEALTH.md
    path: .agentera/health.yaml
    producers: [inspektera]
  - artifact: PLAN.md
    path: .agentera/plan.yaml
    producers: [planera]
  - artifact: TODO.md
    path: TODO.md
    producers: [planera, realisera, inspektera, dokumentera]
  - artifact: CHANGELOG.md
    path: CHANGELOG.md
    producers: [realisera, dokumentera]
  - artifact: DESIGN.md
    path: DESIGN.md
    producers: [visualisera]
index:
