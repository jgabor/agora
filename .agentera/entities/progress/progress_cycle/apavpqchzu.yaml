  what: "Completed Task 2 of the debate ledger plan by adding `internal/ledger/updater.go` and `internal/ledger/updater_test.go`, a new package that produces a typed `types.DebateLedger` from the running deliberation transcript by delegating to the meta-model. The public surface mirrors `evidence.NewPolicyCollector` and `synthesis.Synthesize` conventions: `NewUpdater(runner agent.Runner) *Updater`, `Update(records, topic, model)` returning a typed ledger, `UpdateDryRun(records, topic)` returning a deterministic placeholder ledger without model calls, the `DefaultSystemPrompt` constant whose JSON shape is the typed-state contract ({round, positions[], agreements[], cruxes[], draft{status,text}}), and the `parseLedger(content)` helper that wraps `llmutil.ExtractJSON` and `types.DebateLedger.Validate`. parseLedger returns a structured error on extract failure or validation failure (including required-field-missing cases caught by Validate), never a silent empty or partial ledger. Plan `.agentera/plan.yaml` Task 2 status flipped from `pending` to `complete`."
  commit: pending
  inspiration: "Task 2 of the debate ledger plan defines a mid-deliberation updater that is deliberately separate from the post-hoc synthesis agent in `internal/synthesis`: the synthesis agent owns the essay-shape output contract ({key_arguments, points_of_agreement, unresolved_tensions, recommended_decision, confidence}) written once after deliberation completes, while the updater owns the typed-state-shape contract ({round, positions[], agreements[], cruxes[], draft{status,text}}) produced mid-deliberation after each completed round. Decision 1 (firm) requires the orchestrator to treat the ledger as opaque DATA injected into the envelope and forbids composing prompts from ledger contents; Decision 6 (firm) requires transcripts to persist typed state, not essay-shape JSON. The updater must not touch the orchestrator's `executeTurn` (Task 3 owns envelope injection) and must not persist ledger records (Task 5 owns persistence)."
  discovered: The Task 1 commit `fac3b14` had introduced the typed ledger domain types in `internal/types/types.go` (`DebateLedger`, `LedgerRecord`, `AgentPosition`, `AgreementPoint`, `OpenCrux`, `DraftProposal`) plus the `NewDebateLedger`/`NewLedgerRecord` constructors and `Validate()` methods, but had never committed `.agentera/plan.yaml` itself despite marking Task 1 complete in it. The plan file was untracked in the working tree at Task 2 start. The existing `evidence.PolicyCollector` (`collector.go:166-197` `deriveResearchQueries`) and `synthesis.synthesisEngine.synthesize` provided the canonical prompt-and-parse shape, and `agent.AgentRunner.dryRunResponse` provided the deterministic-placeholder convention the `UpdateDryRun` method mirrors. `Validate()` accepts an empty ledger as a valid initial state, so `parseLedger` returns a structured error only on ExtractJSON failure or Validate() failure rather than rejecting legitimately-empty ledgers the meta-model might return.
