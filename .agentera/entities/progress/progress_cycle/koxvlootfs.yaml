\"warning: ... ledger record missing 'ledger' field (skipping ledger record)\" and is skipped, returns the 2 valid records in order, no error), TestLoadFileLenientFailsOnNonLedgerMalformed PASS (AC3 fail/contract — non-ledger not-json still returns \"malformed transcript record\" error, preserving the existing resume contract), TestLoadFileLenientLegacyTranscriptNoWarnings PASS (AC4 legacy-load success — legacy fixture loads via lenient loader with 3 records, no ledger records, zero warnings), TestRenderTranscriptRendersLedgerSnapshotDistinctly/pass_ledger_record_renders_summary PASS (renders \"Ledger Snapshot\" panel with \"Round 1\", \"positions 2\", \"agreements 1\", \"cruxes 1\", \"draft draft\", \"AGENT ledger\"), TestRenderTranscriptRendersLedgerSnapshotDistinctly/fail_non_ledger_records_do_not_render_ledger_snapshot PASS (non-ledger transcripts render no \"Ledger Snapshot\"), TestLastLedgerFromRecords/pass_returns_most_recent_ledger_clone PASS (resume seed returns the most recent ledger as a deep clone, not aliased), TestLastLedgerFromRecords/fail_legacy_records_return_nil PASS and TestLastLedgerFromRecords/fail_nil_records_return_nil PASS (legacy/nil => nil seed => no injection), TestResumeSeedsLedgerFromSourceAndContinues PASS (resume from a ledger-carrying source completes, output transcript reloads strictly and contains both the copied source ledger and a fresh persisted ledger after the resumed round, proving the seed fed continuity), TestResumeLegacySourceNoLedgerInjection PASS (AC4 legacy resume — legacy source with --no-ledger resumes with zero ledger records injected and no failure), TestShowCommandRejectsMalformedLedgerRecord PASS (AC malformed for show — `agora show` fails strictly on a malformed ledger record; also asserts `agora stats` fails on the same fixture), and TestResumeCommandWarnsAndContinuesOnMalformedLedgerRecord PASS (AC malformed-for-resume — `agora resume` emits \"warning: .../source.jsonl:2: ledger record missing 'ledger' field (sk