id: hqwlrjlntj
artifact: decisions
record:
  date: 2026-07-08
  question: What non-auto default run shape and per_turn_latency_ceiling should Agora use so an out-of-the-box deliberation runs at least three full rounds?
  context: "The prior defaults were demo-hostile: a 60-second time limit, 10 max turns, window 2, consensus_threshold 0 (disabled), and an effective min_rounds of 1. With a five-agent cast this terminated the deliberation after about two shallow rounds, terminated by the clock, before consensus could fire. The debate-ledger plan (cycle 65) explicitly deferred situational-awareness envelope fields and better defaults to a follow-on plan. This is that plan. The new defaults must yield to explicit flags and config values at their existing precedence layer, leave auto-mode caps (Decision 4) unchanged, and apply consensus_threshold and min_rounds at the config-loading layer so direct DeliberationConfig struct construction in tests is unaffected. The per_turn_latency_ceiling is a build-time constant used to derive the time limit from the cast size."
  alternatives:
    - name: Fixed generous defaults
      status: rejected
      description: "Pick fixed values (e.g. 600s, 30 turns, window 5) independent of cast size. Win: simplest. Lose: under-provisioned for large casts and over-provisioned for small ones; a two-agent run gets 30 turns while a fifteen-agent run starves."
    - name: Per-cast linear with no window cap
      status: rejected
      description: "time = k × N, max_turns = k × N, window = N. Win: always one full prior round. Lose: on a 30-agent cast window 30 injects 30 prior messages per turn, blowing the per-turn token budget."
    - name: Cast-scaled defaults with a window maximum
      status: chosen
      description: "time_limit = 3 × N × per_turn_latency_ceiling (ceiling 30s), max_turns = 3 × N, window = min(N, 8), consensus_threshold = numAgents, min_rounds = 3. Win: at least three full rounds before either clock or turn cap; each agent sees a full prior round up to the cap; consensus is enabled so it can early-halt; min_rounds prevents premature consensus. Lose: the 30s ceiling is a build-time estimate that may need tuning per model."
  choice: "Cast-scaled defaults with a window maximum and per_turn_latency_ceiling = 30 seconds. For a non-auto config with N agents and no explicit override: time_limit = 3 × N × 30, max_turns = 3 × N, window = min(N, 8), consensus_threshold = N (applied at LoadConfig), min_rounds = 3 (applied at LoadConfig). Resume non-auto paths mirror these via the same applyNonAutoRunShape helper. Auto-mode caps, explicit CLI flags, and explicit config values override at their existing precedence layer."
  reasoning: "Three rounds is the smallest deliberation that develops, converges, and settles: round one for opening positions, round two for rebuttal, round three for convergence. Sizing time and turns as 3 × N guarantees each round has room to complete before any cap can fire. The 30-second per_turn_latency_ceiling is a deliberately generous build-time estimate covering deliberation-class models; it produces a 450-second (7.5-minute) budget for a five-agent cast, which is long enough for depth without being unbounded. Capping the window at eight bounds per-turn token growth: a full prior round is useful, but injecting fifteen or thirty prior messages per turn on large casts would crowd out the agent's own response budget. Enabling consensus_threshold = numAgents by default means consensus can early-halt a converged deliberation, while min_rounds = 3 prevents a premature groupthink halt. Applying consensus_threshold and min_rounds at the config-loading layer (LoadConfig) keeps the autogen path (LoadConfigFromBytes) and direct struct construction in tests untouched, preserving backward compatibility. Gating each CLI knob on cmd.Flags().Changed(...) preserves the explicit-over-implicit principle: an explicit --time, --max-turns, or --window always wins."
  confidence: provisional
  feeds_into: cmd/agora/main.go, internal/config/config.go, CHANGELOG.md, TODO.md, .agentera/progress.yaml
