    title: Consensus Mechanism Fixes
  what: "Fix the deliberation consensus mechanism which is currently dead code. Agents are never instructed to use the [CONSENSUS: ...] syntax, so the streak tracker always stays at 0 and consensus-based early termination never triggers. Four fixes: add consensus instructions to agent system prompts, pass consensus state into the agent context envelope, set a meaningful autogen default for consensus_threshold, and hide the Agreement bar when threshold is 0."
  why: The consensus mechanism exists as infrastructure (regex detection, streak tracking, termination check) but is entirely inert. This wastes a potential early-termination path that could save time and money when agents converge. The misleading Agreement progress bar erodes trust when it never moves.
  constraints: Keep Go-only implementation. Do not change the consensus detection regex or the orchestrator loop structure. Do not add new dependencies. Preserve backward compatibility for existing configs with consensus_threshold=0.
  scope:
    included:
      - "Add consensus instruction to agent system prompts (instructions on when/how to use [CONSENSUS: ...])"
      - Pass current consensus streak and last statement into the agent context envelope
      - Change autogen default for consensus_threshold from 0 to numAgents
      - Hide the Agreement progress bar and header line when consensus_threshold is 0
    excluded:
      - Adding a mid-loop synthesis check (separate, larger feature)
      - Changing the ConsecutiveConsensusCount algorithm
      - Changing the consensus detection regex
      - Adding new config fields or CLI flags
    deferred:
      - Mid-loop synthesis for implicit agreement detection
  design: "Surgical changes in four locations: agent system prompt builder (to add consensus instructions), agent envelope/payload (to pass consensus state), autogen config defaults, and output render guard. Each fix is independently testable and does not change the deliberation logic — only enables the existing infrastructure to work."
  overall_acceptance:
    - GIVEN all four fixes are applied WHEN a deliberation runs with auto-generated config THEN the consensus mechanism is functional (non-zero threshold, agents know how to signal).
    - GIVEN all four fixes are applied WHEN a manual config with consensus_threshold=0 is used THEN the UI hides all consensus-related display elements cleanly.
    - GIVEN all four fixes are applied WHEN `go test ./...` runs THEN all existing tests pass.
    - GIVEN all four fixes are applied WHEN the e2e script runs THEN all checks pass.
  surprises:
