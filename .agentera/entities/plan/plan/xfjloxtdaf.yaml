    title: "Plan: Better Defaults and Situational Awareness"
  what: "Replace the demo-hostile default run shape (60s time, 10 max-turns, window 2, consensus_threshold 0, effective min_rounds 1) with defaults that allow a real multi-round deliberation to occur without explicit user tuning, and expand the per-turn agent envelope with the situational fields an agent needs to act on those defaults: the agent's own ID, the cast roster, the current turn and round counters, the remaining budget expressed in the unit each active cap supports (turns, rounds, or time), and the halting rule currently in effect. Two tightly-coupled changes, one plan, because defaults without situational awareness leave agents unable to act on a \"two rounds remain\" signal, and situational awareness without usable defaults gives agents nothing worth knowing about. The two work-streams are code-orthogonal and may execute in parallel; they share only the state-sync gate."
  why: "The codebase confirms the TODO's claims: an out-of-the-box `agora run` defaults to 60 seconds, max-turns 10, window 2, and a disabled consensus threshold; with five agents this is two shallow rounds terminated by the clock; with the threshold disabled the only early-halt is the clock. The deliberation-ledger plan (cycle 65, just completed and archived) explicitly excluded \"situational-awareness envelope fields (roster, turn number, budget, halting rule)\" from its scope and deferred them to \"a follow-on plan that reopens the same envelope code path.\" This is that plan. Defaults fix the unobservable baseline; envelope fields unblock the roadmap's moderator loop, phase structure, and convergence metrics, all of which need round and turn state to operate. The roadmap ranks the proposal-and-voting artifact as Missing Piece number one by theoretical impact; this plan deliberately precedes it because no one can observe whether the consensus mechanism is good or bad while defaults prevent it from firing, and the moderator, phase, and convergence work all need situational state the envelope does not yet carry."
  constraints: "Minimal orchestrator (Decision 1, firm): situational fields are data injected into the structured JSON envelope; the orchestrator marshals them as facts, not directives, and must not compose prompt prose from their contents. Go-only single static binary (Decision 2, firm): no external services or subprocesses beyond the existing agent runtime. Existing-precedence preservation: new defaults yield to explicit overrides at their existing precedence layer only — time, max_turns, and window yield to their CLI flags and (for auto configs) to auto-level caps; consensus_threshold and min_rounds yield to explicit values in the config file. Adding brand-new settings keys for these knobs is out of scope and deferred. Charm v2 visual system (Decision 7, firm): any surfaced situational state in the live CLI renders through the existing output module. Auto-mode caps (Decision 4, provisional): auto-level MaxTurns and TimeLimits are out of scope; this plan changes only the non-auto defaults. Backward compatibility: existing configs, settings, and transcripts continue to load, run, and resume without modification; the new envelope keys are additive and the transcript record schema is unchanged. Off-limits: the consensus regex mechanism, the deliverable-gate regex, the proposal/voting artifact (roadmap #1), the moderator loop (roadmap #2), the phase structure (roadmap #3), and per-turn phase instructions in the envelope (\"you must address X's objection\") — that belongs to the phase-structure plan. The envelope's existing keys (topic, history, evidence, ledger) are additive only — no renaming or reshaping of the existing contract."
  scope:
    included:
      - Default time, max-turns, window, consensus_threshold, and min_rounds for non-auto `agora run` and `agora resume` invocations
      - Resume flag defaults mirror the new run defaults for time, max-turns, and window
      - "Per-turn envelope expansion: agent's own ID, cast roster, current turn index, current round, remaining budget (in turns, rounds, or time, whichever each active cap supports), and the halting rule in effect"
      - Consensus-threshold and min_rounds defaults applied at config-loading layer so direct DeliberationConfig struct construction in tests is unaffected
      - Window auto-scale bounded by a maximum to prevent per-turn token-budget explosion on large casts
      - Dry-run path emits the same envelope shape deterministically
      - "Transcript and resume schema compatibility: prior-release transcripts load and resume"
      - Minor version bump per the docs.yaml feat-minor policy
      - CHANGELOG entry and TODO cleanup for roadmap items 5 and 6
      - Decision record for the default-values math chosen and why
    excluded:
      - Auto-mode level caps (Decision 4) — quick/normal/deep/yolo MaxTurns and TimeLimits remain unchanged
      - New settings keys for time/window/max_turns/consensus_threshold/min_rounds — future work
      - "First-class proposal artifact with real voting (roadmap #1)"
      - "Active moderator loop consuming situational state (roadmap #2)"
      - "Phase structure — opening, rebuttal, convergence vote (roadmap #3)"
      - "Convergence and stalemate metrics (roadmap #4)"
      - Per-turn phase instructions in the envelope
      - Agent-visible budget pressure surfaced as cost rather than turns or rounds or time
      - Cross-run memory of prior situational state
    deferred:
      - Phase-aware per-turn instructions, deferred to the phase-structure plan
      - Moderator-driven next-speaker selection, deferred to the moderator-loop plan
      - Convergence metrics consuming turn-over-turn similarity, deferred
      - Settings keys for the new defaults (default_time, default_window, default_max_turns, default_consensus_threshold, default_min_rounds), deferred
  design: "Three work-streams with one parallel pair. Stream A revises the non-auto default values so an out-of-the-box `agora run` produces a multi-round deliberation terminated by consensus, by the turn count, or by the time budget — not by a 60-second clock after two shallow rounds. The window auto-scales so each agent sees at least one full prior round of context, bounded by a maximum to prevent per-turn token-budget explosion on large casts. The consensus threshold enables by default so consensus can early-halt before max_turns. The minimum-rounds floor raises so consensus cannot halt before the deliberation has had at least three rounds to develop. The new defaults yield to explicit overrides at their existing precedence layer only. Stream B runs in parallel to Stream A and expands the per-turn envelope the orchestrator already marshals with the situational fields an agent needs to use the new default budget: the agent's own ID, the cast roster, the current turn index, the current round, the remaining budget expressed in the unit each active cap supports (turns remaining when max_turns is positive, rounds remaining derived from turns, time remaining when only a time limit is active, and an explicit uncapped signal when neither), and the halting rule currently in effect — every active cap and the value at which it triggers, including any deliverable gate. The orchestrator marshals these as envelope facts only; it does not compose prompt prose from their contents. Stream C depends on A and B and is state sync — documentation, decisions record for the default math chosen, version bump per feat-minor, and TODO cleanup for roadmap items 5 and 6."
  overall_acceptance: A default non-auto `agora run --config <five-agent-config> --topic "..."` with no explicit overrides produces a deliberation that runs at least three full rounds unless consensus halts it earlier, the effective window shows each agent at least one full prior round (bounded by a maximum to prevent token-budget explosion on large casts), the consensus threshold is enabled and the min_rounds floor is at least three so consensus cannot halt before three rounds, and every agent envelope contains the agent's own ID, the cast roster, the current turn and round counters, the remaining budget expressed in the unit each active cap supports, and the halting rule in effect. An explicit flag or config value at its existing precedence layer overrides the new defaults. An auto-mode invocation is unaffected. A resume invocation's time, max_turns, and window defaults match the new run defaults. A dry-run invocation emits the new envelope shape deterministically. A transcript from a release before this plan loads, runs, and resumes without failure and without the new envelope fields. The project's test suite, build, and lint commands all pass and the diff hygiene check is clean.
